framework:
    messenger:
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            # Route your messages to the transports
            'App\Message\ProcessPaymentEvent': async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
